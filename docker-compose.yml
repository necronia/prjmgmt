services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: prjmgmt
      POSTGRES_PASSWORD: prjmgmt
      POSTGRES_DB: prjmgmt
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prjmgmt -d prjmgmt"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"   # 호스트 5432 충돌 회피 (컨테이너 내부는 db:5432 그대로)

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://prjmgmt:prjmgmt@db:5432/prjmgmt
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      EMBED_CACHE_DIR: /models
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173,http://localhost:5174
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - models:/models   # 임베딩 모델 캐시 (fetch_model.sh 로 미리 채움)
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  models:
